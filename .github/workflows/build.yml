name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            vs-version: '18'
            msvc-arch: x64
            package-platform: windows
            package-name: dv-windows-x64.exe
          - runner: windows-11-vs2026-arm
            vs-version: '18'
            msvc-arch: arm64
            package-platform: windows
            package-name: dv-windows-arm64.exe
          - runner: ubuntu-latest
            qt-host: linux
            qt-arch: linux_gcc_64
            package-platform: linux
            package-name: dv-linux-x64.AppImage
          - runner: macos-latest
            qt-host: mac
            qt-arch: clang_64
            package-platform: macos
            package-name: dv-macos-arm64.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-msvc-ci.ps1 -Architecture ${{ matrix.msvc-arch }} -VisualStudioMajor ${{ matrix.vs-version }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf fonts-dejavu-core libgl1-mesa-dev libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 xvfb

      - name: Identify Windows Qt toolchain
        if: runner.os == 'Windows'
        id: qt-toolchain
        shell: pwsh
        run: |
          "msvc=$($env:VCToolsVersion.Trim())" >> $env:GITHUB_OUTPUT
          "sdk=$($env:WindowsSDKVersion.TrimEnd('\'))" >> $env:GITHUB_OUTPUT

      - name: Cache compiled Windows Qt
        if: runner.os == 'Windows'
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/qt-lto/install
          key: qt-source-6.11.2-${{ matrix.msvc-arch }}-${{ steps.qt-toolchain.outputs.msvc }}-${{ steps.qt-toolchain.outputs.sdk }}-${{ hashFiles('build-qt-msvc.ps1', 'scripts/invoke-checked.ps1') }}

      - name: Compile Windows Qt with MSVC and LTO
        if: runner.os == 'Windows' && steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build-qt-msvc.ps1 -UseCurrentEnvironment -Architecture ${{ matrix.msvc-arch }} -Prefix C:/qt-lto/install -SourceRoot C:/qt-lto/src -BuildRoot C:/qt-lto/build -Jobs 4

      - name: Use compiled Windows Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:/qt-lto/install/bin' >> $env:GITHUB_PATH
          'CMAKE_PREFIX_PATH=C:/qt-lto/install' >> $env:GITHUB_ENV
          'QT_QPA_PLATFORM_PLUGIN_PATH=C:/qt-lto/install/plugins/platforms' >> $env:GITHUB_ENV

      - name: Install Qt
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/.github/aqt.ini
        with:
          version: '6.11.2'
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          py7zrversion: '==1.1.0'
          # Linux's default archive set also supplies Qt's matching ICU libraries.
          cache: true
          cache-key-prefix: qt-6.11.2-${{ matrix.runner }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage -DCMAKE_INSTALL_LIBDIR=lib

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Check repeated Windows document requests
        if: runner.os == 'Windows'
        run: ctest --test-dir build -R request_tests --repeat until-fail:30 --output-on-failure --timeout 120

      - name: Show request test diagnostics
        if: failure()
        shell: bash
        run: cat build/Testing/Temporary/request-tests.txt 2>/dev/null || true

      - name: Deploy application and dependencies
        run: cmake --install build

      - name: Deploy MSVC runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/deploy-msvc-runtime.ps1 -Stage stage -Architecture ${{ matrix.msvc-arch }}

      - name: Install AppImage packaging tool
        if: runner.os == 'Linux'
        run: |
          curl -fL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o build/appimagetool
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  build/appimagetool' | sha256sum -c -
          chmod +x build/appimagetool

      - name: Create single-file distribution
        run: python packaging/package.py --platform ${{ matrix.package-platform }} --stage stage --output dist/${{ matrix.package-name }} --appimagetool build/appimagetool

      - name: Test portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-portable.ps1 -Executable "dist/${{ matrix.package-name }}"

      - name: Test Linux AppImage
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/${{ matrix.package-name }} --appimage-extract-and-run --smoke-test

      - name: Test macOS application bundle
        if: runner.os == 'macOS'
        run: stage/DocumentViewer.app/Contents/MacOS/DocumentViewer --smoke-test

      - name: Upload application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ matrix.package-name }}
          archive: false
          if-no-files-found: error

      - name: Collect test logs without compression
        if: failure()
        shell: bash
        run: |
          if [ -d build/Testing/Temporary ]; then
            tar -cf test-logs-${{ matrix.runner }}.tar -C build/Testing Temporary
          fi

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: test-logs-${{ matrix.runner }}.tar
          archive: false
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested application artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dv-*
          merge-multiple: true
          skip-decompress: true
          path: release-files

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          for file in dv-windows-x64.exe dv-windows-arm64.exe dv-macos-arm64.dmg dv-linux-x64.AppImage; do
            test -s "$file"
          done

      - name: Publish all platform downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          # Upload to a draft first so incomplete uploads are not published.
          # Existing releases are deliberately not overwritten on a rerun.
          gh release create "$RELEASE_TAG" release-files/* \
            --verify-tag --draft --generate-notes --title "$RELEASE_TAG" "${options[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
